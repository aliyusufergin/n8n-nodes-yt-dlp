name: v0.2.1 Release Candidate Chain

on:
  workflow_dispatch:
    inputs:
      publish_mode:
        description: Stage stops for human tarball review and 2FA approval.
        required: true
        type: choice
        options:
          - stage
          - verify-existing
      promote_latest:
        description: Verify an interactively promoted latest candidate.
        required: true
        default: false
        type: boolean

concurrency:
  group: release-0.2.1
  cancel-in-progress: false

permissions:
  contents: read

env:
  HERMETIC_IMAGE: node@sha256:8d3442d5f074940723be6eece34e992eb147ba1f59c73888e8f257918dea2e78
  NODE_VERSION: 24.16.0
  NPM_VERSION: 11.16.0
  # The 0.2.1 stage run that built the candidate and staged it; a maintainer's 2FA approval, not
  # the run, published it. `verify-existing` downloads its
  # `release-candidate-0.2.1` artifact and requires this manifest SHA-256, so the pair must be
  # replaced whenever a new candidate is published; a stale pair fails the checksum check in the
  # candidate job rather than verifying the wrong bytes.
  PUBLISHED_CANDIDATE_RUN_ID: 31880525687
  PUBLISHED_CANDIDATE_SHA256: 036a5ae8d9fed314cc1ef465cc3e86ce52eb2562e468974528cd96792573eb47
  RELEASE_WORKFLOW_REF: ${{ github.ref }}
  RUNNER_REGION: ${{ vars.RUNNER_REGION }}
  VERSION: 0.2.1

jobs:
  candidate:
    name: candidate
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: actions/setup-node@v7
        with:
          cache: npm
          node-version: ${{ env.NODE_VERSION }}
      - if: inputs.publish_mode == 'verify-existing'
        uses: actions/download-artifact@v8
        with:
          name: release-candidate-0.2.1
          path: ${{ runner.temp }}/release-candidate
          run-id: ${{ env.PUBLISHED_CANDIDATE_RUN_ID }}
          github-token: ${{ github.token }}
      - if: inputs.publish_mode != 'verify-existing'
        run: npm install --global "npm@$NPM_VERSION"
      - run: npm ci
      - if: inputs.publish_mode != 'verify-existing'
        run: |
          test "$(node --print "require('./package.json').version")" = "$VERSION"
          npm run release:candidate -- "$RUNNER_TEMP/release-candidate"
      - if: inputs.publish_mode == 'verify-existing'
        run: |
          printf '%s  %s\n' \
            "$PUBLISHED_CANDIDATE_SHA256" \
            "$RUNNER_TEMP/release-candidate/release-candidate.json" | sha256sum --check --strict
          node scripts/release-candidate.mjs verify "$RUNNER_TEMP/release-candidate"
      - run: sha256sum "$RUNNER_TEMP/release-candidate/release-candidate.json"
      - if: inputs.publish_mode != 'verify-existing'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ runner.temp }}/release-candidate/tarballs/*.tgz
      - uses: actions/upload-artifact@v7
        with:
          name: release-candidate-0.2.1
          path: ${{ runner.temp }}/release-candidate
          if-no-files-found: error
          retention-days: 30

  source-delivery:
    name: source-delivery
    needs: candidate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: actions/setup-node@v7
        with:
          cache: npm
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v8
        with:
          name: release-candidate-0.2.1
          path: .release-candidate
      - run: npm ci
      - run: npm run verify:ffmpeg-release
      - run: |
          node scripts/release-candidate.mjs record-gate \
            .release-candidate/release-candidate.json \
            source-delivery \
            source-delivery.json
      - uses: actions/upload-artifact@v7
        with:
          name: gate-source-delivery
          path: source-delivery.json
          if-no-files-found: error

  prepublication:
    name: prepublication
    needs: candidate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: actions/setup-node@v7
        with:
          cache: npm
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v8
        with:
          name: release-candidate-0.2.1
          path: .release-candidate
      - run: npm ci
      - run: npm test

  three-anchor:
    name: three-anchor
    if: >-
      always() &&
      inputs.publish_mode == 'verify-existing' &&
      needs.registry-readback.result == 'success'
    needs:
      - registry-readback
    runs-on: [self-hosted, linux, x64, release-e2e]
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      # The regional runner keeps its own ~/.npm between jobs, so the action-level npm cache is
      # left off here: its post step would upload gigabytes over a home connection every job.
      # actions/checkout fetches LFS objects but will not rewrite paths it considers unchanged,
      # so a runner whose workspace persists keeps whatever pointer files an earlier checkout
      # left there. The lanes execute these binaries, so they hydrate them explicitly.
      - run: git lfs pull
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v8
        with:
          name: published-candidate-0.2.1
          path: .release-candidate
      - run: npm ci
      - run: npm run test:e2e:release-gate
        env:
          E2E_RELEASE_CANDIDATE_ROOT: ${{ github.workspace }}/.release-candidate
          E2E_REQUIRE_PUBLISHED_NEXT: 'true'
      - run: node e2e/release-gate/run.mjs --list > three-anchor-identities.json
      - run: |
          node scripts/release-candidate.mjs record-gate \
            .release-candidate/release-candidate.json \
            three-anchor \
            three-anchor.json \
            three-anchor-identities.json
      - uses: actions/upload-artifact@v7
        with:
          name: gate-three-anchor
          path: three-anchor.json
          if-no-files-found: error

  multiworker:
    name: multiworker
    if: >-
      always() &&
      inputs.publish_mode == 'verify-existing' &&
      needs.registry-readback.result == 'success'
    needs:
      - registry-readback
    runs-on: [self-hosted, linux, x64, release-e2e]
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      # The regional runner keeps its own ~/.npm between jobs, so the action-level npm cache is
      # left off here: its post step would upload gigabytes over a home connection every job.
      # actions/checkout fetches LFS objects but will not rewrite paths it considers unchanged,
      # so a runner whose workspace persists keeps whatever pointer files an earlier checkout
      # left there. The lanes execute these binaries, so they hydrate them explicitly.
      - run: git lfs pull
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v8
        with:
          name: published-candidate-0.2.1
          path: .release-candidate
      - run: npm ci
      - run: npm run test:e2e:multiworker
        env:
          E2E_RELEASE_CANDIDATE_ROOT: ${{ github.workspace }}/.release-candidate
          E2E_REQUIRE_PUBLISHED_NEXT: 'true'
      - run: node e2e/release-gate/run.mjs --describe-lane multiworker > multiworker-identities.json
      - run: |
          node scripts/release-candidate.mjs record-gate \
            .release-candidate/release-candidate.json \
            multiworker \
            multiworker.json \
            multiworker-identities.json
      - uses: actions/upload-artifact@v7
        with:
          name: gate-multiworker
          path: multiworker.json
          if-no-files-found: error

  capacity:
    name: capacity
    if: >-
      always() &&
      inputs.publish_mode == 'verify-existing' &&
      needs.registry-readback.result == 'success'
    needs:
      - registry-readback
    runs-on: [self-hosted, linux, x64, release-capacity]
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      # The regional runner keeps its own ~/.npm between jobs, so the action-level npm cache is
      # left off here: its post step would upload gigabytes over a home connection every job.
      # actions/checkout fetches LFS objects but will not rewrite paths it considers unchanged,
      # so a runner whose workspace persists keeps whatever pointer files an earlier checkout
      # left there. The lanes execute these binaries, so they hydrate them explicitly.
      - run: git lfs pull
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v8
        with:
          name: published-candidate-0.2.1
          path: .release-candidate
      - run: npm ci
      - run: npm run test:e2e:capacity
        env:
          E2E_RELEASE_CANDIDATE_ROOT: ${{ github.workspace }}/.release-candidate
          E2E_REQUIRE_PUBLISHED_NEXT: 'true'
      - run: node e2e/release-gate/run.mjs --describe-lane capacity > capacity-identities.json
      - run: |
          node scripts/release-candidate.mjs record-gate \
            .release-candidate/release-candidate.json \
            capacity \
            capacity.json \
            capacity-identities.json
      - uses: actions/upload-artifact@v7
        with:
          name: gate-capacity
          path: capacity.json
          if-no-files-found: error

  official-ejs:
    name: official-ejs
    if: >-
      always() &&
      inputs.publish_mode == 'verify-existing' &&
      needs.registry-readback.result == 'success'
    needs:
      - registry-readback
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          cache: npm
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v8
        with:
          name: published-candidate-0.2.1
          path: .release-candidate
      - run: npm ci
      - name: solves official frozen EJS vectors
        run: npm test -- test/platform-packages.test.ts -t "solves official frozen EJS"
        env:
          E2E_RELEASE_CANDIDATE_ROOT: ${{ github.workspace }}/.release-candidate
      - run: |
          node scripts/release-candidate.mjs record-gate \
            .release-candidate/release-candidate.json \
            official-ejs \
            official-ejs.json \
            test/fixtures/ejs/vectors.json
      - uses: actions/upload-artifact@v7
        with:
          name: gate-official-ejs
          path: official-ejs.json
          if-no-files-found: error

  live-canary:
    name: live-canary
    if: >-
      always() &&
      inputs.publish_mode == 'verify-existing' &&
      needs.registry-readback.result == 'success'
    needs:
      - registry-readback
    # The canary asks whether the packaged extractor and challenge provider still work against live
    # YouTube from a recorded region. A hosted runner answers a different question: its address
    # range is refused before the extractor is reached, which reads as a toolchain failure. The same
    # published bytes that fail there pass from the configured region, so the lane runs on the
    # regional runner and `RUNNER_REGION` describes where the result actually came from.
    runs-on: [self-hosted, linux, x64, release-e2e]
    steps:
      - uses: actions/checkout@v7
      # The regional runner keeps its own ~/.npm between jobs, so the action-level npm cache is
      # left off here: its post step would upload gigabytes over a home connection every job.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v8
        with:
          name: published-candidate-0.2.1
          path: .release-candidate
      - run: npm ci
      - run: |
          npm run release:live-canary -- \
            .release-candidate/release-candidate.json \
            live-canary.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gate-live-canary
          path: live-canary.json
          if-no-files-found: error

  publish-next:
    name: publish-next
    if: inputs.publish_mode != 'verify-existing'
    needs:
      - source-delivery
      - prepublication
    runs-on: ubuntu-24.04
    # The npm Trusted Publisher for all three packages names this workflow, this repository, and this
    # environment, and grants `stage publish` alone. The job therefore carries no publication
    # credential of its own: it stages the exact candidate tarballs over OIDC, and each one becomes
    # public only when a maintainer reviews it and approves it with npm 2FA.
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-candidate-0.2.1
          path: .release-candidate
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
      - run: npm install --global "npm@$NPM_VERSION"
      - name: stage dependency-ordered next candidate
        env:
          # `registry-url` above writes `:_authToken=${NODE_AUTH_TOKEN}` into the runner npmrc, and
          # npm leaves an unset variable in place as that literal string, which reads as credentials
          # and turns a missing OIDC token into an opaque registry 401. An empty value is no
          # credential, so the same failure reports `ENEEDAUTH` instead.
          NODE_AUTH_TOKEN: ''
        run: |
          platform=".release-candidate/tarballs/n8n-nodes-yt-dlp-linux-x64-${VERSION}.tgz"
          selector=".release-candidate/tarballs/n8n-nodes-yt-dlp-platform-${VERSION}.tgz"
          main=".release-candidate/tarballs/n8n-nodes-yt-dlp-${VERSION}.tgz"
          npm stage publish "$platform" --provenance --tag next --access public
          npm stage publish "$selector" --provenance --tag next --access public
          npm stage publish "$main" --provenance --tag next --access public

  registry-readback:
    name: registry-readback
    if: always() && inputs.publish_mode == 'verify-existing'
    needs: publish-next
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: release-candidate-0.2.1
          path: .release-candidate
      # A run dispatched with `promote_latest` verifies an already promoted candidate, so it reads
      # back the tag state promotion produced. Without the flag the read-back requires the staged
      # state instead, where `latest` still names the previous release.
      # A dispatched boolean can arrive as a boolean or as its string form, and a non-empty string
      # is truthy in an expression while a job `if` reads the literal string `false` as false. A bare
      # `inputs.promote_latest` therefore passes `--promoted` for a run whose `promote-latest` job is
      # skipped, which is exactly backwards: the staged read-back would accept a promoted `latest`.
      # Both forms are compared explicitly instead.
      - env:
          PROMOTED: >-
            ${{ (inputs.promote_latest == true || inputs.promote_latest == 'true')
            && '--promoted' || '' }}
        run: |
          node scripts/release-candidate.mjs materialize-registry \
            .release-candidate \
            https://registry.npmjs.org \
            "$RUNNER_TEMP/published-candidate" \
            registry-readback.json \
            $PROMOTED
      - uses: actions/upload-artifact@v7
        with:
          name: published-candidate-0.2.1
          path: ${{ runner.temp }}/published-candidate
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v7
        with:
          name: gate-registry-readback
          path: registry-readback.json
          if-no-files-found: error

  partial-publish-audit:
    name: partial-publish-audit
    if: >-
      always() &&
      inputs.publish_mode == 'stage' &&
      needs.publish-next.result != 'success' &&
      needs.publish-next.result != 'skipped'
    needs: publish-next
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release-candidate-0.2.1
          path: .release-candidate
      # Nothing is public until a maintainer approves a staged package with 2FA, so on a first stage
      # run that fails midway this reports all three as missing, which is not a partial publication.
      # It carries a finding on a retry, where an already-approved package is public and
      # `npm stage publish` refuses it.
      - name: report exact package names after partial publication
        run: |
          node scripts/release-candidate.mjs audit-registry \
            .release-candidate/release-candidate.json \
            https://registry.npmjs.org \
            partial-publish-audit.json
      - uses: actions/upload-artifact@v7
        with:
          name: partial-publish-audit
          path: partial-publish-audit.json
          if-no-files-found: error

  hermetic:
    name: hermetic
    if: >-
      always() &&
      inputs.publish_mode == 'verify-existing' &&
      needs.registry-readback.result == 'success'
    needs:
      - registry-readback
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: actions/setup-node@v7
        with:
          cache: npm
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v8
        with:
          name: published-candidate-0.2.1
          path: .release-candidate
      - run: npm ci
      - run: node scripts/release-candidate.mjs verify .release-candidate
      - run: docker pull "$HERMETIC_IMAGE"
      - name: run candidate-bound suite with egress denied
        run: |
          # The container runs as the runner's own uid so the bind-mounted workspace keeps its
          # ownership, but that uid is absent from the image's passwd database, and `os.userInfo()`
          # then fails with uv_os_get_passwd ENOENT before the release build can start. Naming that
          # uid in a passwd file is the smallest fix that keeps the unprivileged user. The image's
          # own entries are kept so that a lookup of root or node still resolves, and the runner's
          # entry is written first because getpwuid takes the first match: were the runner to share
          # a uid with an image entry, that entry's unwritable home would reintroduce this failure.
          {
            printf 'hermetic:x:%s:%s:hermetic:/tmp:/bin/sh\n' "$(id -u)" "$(id -g)"
            docker run --rm "$HERMETIC_IMAGE" cat /etc/passwd
          } > "$RUNNER_TEMP/hermetic-passwd"
          # --init gives the container a reaping PID 1. Without it the killed descendants of the
          # process-group timeout test are reparented to npm, which never reaps them, so the
          # supervisor still sees the group and reports that it survived SIGKILL.
          #
          # --read-only covers the container's own root, so /tmp is its writable scratch space and
          # holds the candidate tarballs, the extracted packages, the temporary workspaces, and the
          # npm cache at once. A measured run peaks at 2.43 GiB there, so the tmpfs is sized well
          # above that; below the peak the suite fails late with ENOSPC.
          docker run --rm \
            --init \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,exec,size=6g \
            --user "$(id -u):$(id -g)" \
            --env E2E_RELEASE_CANDIDATE_ROOT=/workspace/.release-candidate \
            --env HOME=/tmp \
            --env RUNNER_REGION="$RUNNER_REGION" \
            --env npm_config_cache=/tmp/npm-cache \
            --mount "type=bind,source=$RUNNER_TEMP/hermetic-passwd,target=/etc/passwd,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace" \
            --workdir /workspace \
            "$HERMETIC_IMAGE" \
            npm test
      - run: |
          printf '{"isolation":{"image":"%s","network":"none"}}\n' \
            "$HERMETIC_IMAGE" > hermetic-identities.json
      - run: |
          node scripts/release-candidate.mjs record-gate \
            .release-candidate/release-candidate.json \
            hermetic \
            hermetic.json \
            hermetic-identities.json
      - uses: actions/upload-artifact@v7
        with:
          name: gate-hermetic
          path: hermetic.json
          if-no-files-found: error

  acceptance-stack:
    name: acceptance-stack
    if: >-
      always() &&
      inputs.publish_mode == 'verify-existing' &&
      needs.registry-readback.result == 'success'
    needs:
      - registry-readback
    # The job runs no test: it validates operator-supplied evidence that is already bound to the
    # candidate digest. A self-hosted runner would verify nothing, would place the evidence secret in
    # a persistent workspace, and on the acceptance host would give every merge code execution beside
    # production n8n. The binding is `candidateSha256`, `identities`, and the environment reviewer.
    runs-on: ubuntu-24.04
    environment: acceptance-stack
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v8
        with:
          name: published-candidate-0.2.1
          path: .release-candidate
      - name: verify approved narrow acceptance-stack evidence
        env:
          ACCEPTANCE_STACK_EVIDENCE_JSON: ${{ secrets.ACCEPTANCE_STACK_EVIDENCE_JSON }}
        run: |
          test -n "$ACCEPTANCE_STACK_EVIDENCE_JSON"
          printf '%s\n' "$ACCEPTANCE_STACK_EVIDENCE_JSON" > acceptance-stack.json
          node scripts/release-candidate.mjs verify-gate \
            .release-candidate/release-candidate.json \
            acceptance-stack \
            acceptance-stack.json
      - uses: actions/upload-artifact@v7
        with:
          name: gate-acceptance-stack
          path: acceptance-stack.json
          if-no-files-found: error

  release-evidence:
    name: release-evidence
    if: always() && inputs.publish_mode == 'verify-existing' && needs.acceptance-stack.result == 'success'
    needs:
      - source-delivery
      - hermetic
      - three-anchor
      - multiworker
      - capacity
      - official-ejs
      - live-canary
      - registry-readback
      - acceptance-stack
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v8
        with:
          name: published-candidate-0.2.1
          path: .release-candidate
      - uses: actions/download-artifact@v8
        with:
          pattern: gate-*
          path: .gate-evidence
          merge-multiple: true
      - run: |
          npm run release:evidence -- \
            .release-candidate/release-candidate.json \
            .gate-evidence \
            "release-evidence-${VERSION}.json"
      - uses: actions/upload-artifact@v7
        with:
          name: release-evidence-0.2.1
          path: release-evidence-0.2.1.json
          if-no-files-found: error
          retention-days: 90
      # The evidence for a version is uploaded once and never overwritten. A repeat `verify-existing`
      # run over the same published bytes — which is what a promotion read-back is — must leave the
      # first run's asset in place, and must not fail the release for finding it there: that failure
      # would skip `promote-latest` for a reason unrelated to the candidate.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          published=$(gh release view "v${VERSION}" --json assets --jq '.assets[].name')
          if printf '%s\n' "$published" | grep -qxF "release-evidence-${VERSION}.json"; then
            echo "release-evidence-${VERSION}.json is already published; leaving it unchanged."
          else
            gh release upload "v${VERSION}" "release-evidence-${VERSION}.json"
          fi

  promote-latest:
    name: promote-latest
    if: >-
      inputs.publish_mode == 'verify-existing' &&
      (inputs.promote_latest == true || inputs.promote_latest == 'true')
    needs: release-evidence
    runs-on: ubuntu-24.04
    environment: npm-promotion
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          cache: npm
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v8
        with:
          name: published-candidate-0.2.1
          path: .release-candidate
      # The read-back verifies each package's Sigstore provenance again, which needs the pinned
      # `sigstore` dependency present.
      - run: npm ci
      - name: verify interactive 2FA promotion with main moved last
        run: |
          node scripts/release-candidate.mjs verify-promotion \
            .release-candidate \
            https://registry.npmjs.org \
            promotion.json
      - uses: actions/upload-artifact@v7
        with:
          name: gate-promote-latest
          path: promotion.json
          if-no-files-found: error
